general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
    no_fade_out = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    noise = 0.011
    contrast = 0.90
    brightness = 0.82
    vibrancy = 0.17
    vibrancy_darkness = 0.0
}

label {
    monitor =
    text = cmd[update:1000] date '+%A, %d %B'
    color = rgba(235,235,235,0.85)
    font_family = JetBrainsMono Nerd Font
    font_size = 20

    position = 0,330
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date '+%H:%M'
    color = rgba(255,255,255,1.0)
    font_family = JetBrainsMono Nerd Font Bold
    font_size = 112

    position = 0,200
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(255,255,255,0.65)
    font_family = JetBrainsMono Nerd Font
    font_size = 16

    position = 0,-120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:500] bash -c '[ "$(hyprctl devices -j | jq -r ".keyboards[0].capsLock")" = "true" ] && printf "󰪛 CAPS LOCK" || printf ""'
    color = rgba(255,190,80,1.0)
    font_family = JetBrainsMono Nerd Font Bold
    font_size = 13

    position = 0,-165
    halign = center
    valign = center
}

input-field {
    monitor =

    size = 360,52

    outline_thickness = 2
    rounding = 4

    outer_color = rgba(255,255,255,0.20)
    inner_color = rgba(20,20,20,0.82)
    font_color = rgba(255,255,255,1.0)

    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0,0,0,0.45)

    dots_center = true
    dots_size = 0.24
    dots_spacing = 0.35

    fade_on_empty = false
    placeholder_text = Password

    hide_input = false

    check_color = rgba(120,220,120,1.0)
    fail_color = rgba(255,95,95,1.0)
    fail_text = <span foreground="##ff5f5f">$FAIL</span>
    fail_transition = 250

    capslock_color = rgba(255,190,80,1.0)

    position = 0,-210
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] bash -c 'cap=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n1); printf "󰁹 %s%%" "$cap"'
    color = rgba(255,255,255,0.60)
    font_family = JetBrainsMono Nerd Font
    font_size = 13

    position = 30,30
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:10000] bash -c 'wifi=$(nmcli -t -f active,ssid dev wifi | grep "^yes:" | cut -d: -f2); layout=$(hyprctl devices -j | jq -r ".keyboards[0].active_keymap"); printf "󰤨 %s  •  󰌌 %s" "$wifi" "$layout"'
    color = rgba(255,255,255,0.60)
    font_family = JetBrainsMono Nerd Font
    font_size = 13

    position = -30,30
    halign = right
    valign = bottom
}
